[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "best-buds-cultivator-weight-station"
version = "2.0.0rc10.post1"
description = "Local-first barcode-driven cultivation weight station"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "PolyForm-Noncommercial-1.0.0"}
authors = [{name = "Best Buds / Avarachi Ventures"}]
dependencies = ["openpyxl>=3.1", "pyserial>=3.5", "python-docx>=1.1"]

[project.optional-dependencies]
desktop = ["PySide6>=6.7"]
serial = ["pyserial>=3.5"]
dev = ["pytest>=8", "jsonschema>=4", "PyYAML>=6", "pytest-qt>=4"]

[project.scripts]
best-buds-weight-station = "best_buds_weight_station.cli:main"
best-buds-weight-station-validation = "best_buds_weight_station.validation.cli:main"
best-buds-weight-station-bootstrap = "best_buds_weight_station.bootstrap:main"
best-buds-weight-station-onboard = "best_buds_weight_station.onboard:main"
best-buds-weight-station-stage = "best_buds_weight_station.stage_runner.cli:main"

[project.gui-scripts]
best-buds-weight-station-gui = "best_buds_weight_station.cli:main"

[tool.setuptools]
package-dir = {"" = "app"}

[tool.setuptools.packages.find]
where = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
qt_api = "pyside6"
