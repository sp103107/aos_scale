name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Repo validate (warn-first for bring-up RC)
        continue-on-error: true
        run: python scripts/validate_repo.py
      - name: Test
        run: pytest -q

  build-debian:
    needs: validate-source
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - uses: actions/checkout@v4
      - name: Build .deb
        run: |
          apt-get update
          apt-get install -y python3 python3-pip python3-openpyxl dpkg-dev
          chmod +x scripts/build_debian.sh || true
          ./scripts/build_debian.sh
      - uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: dist/debian/*.deb
          if-no-files-found: warn

  build-windows:
    needs: validate-source
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Inno Setup 6
        shell: powershell
        run: |
          choco install innosetup --yes --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after chocolatey install" }
          Write-Host "ISCC=$iscc"
      - name: Build Windows package
        shell: powershell
        run: ./packaging/windows/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: dist/windows/*
          if-no-files-found: warn

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-debian, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble checksums
        run: |
          mkdir -p release_assets
          find artifacts -type f -print0 | while IFS= read -r -d '' f; do
            cp "$f" "release_assets/$(basename "$f")"
          done
          cd release_assets
          sha256sum * > SHA256SUMS.txt || true
          ls -la
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          body_path: docs/RELEASE_CANDIDATE.md
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
